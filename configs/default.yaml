# Default hyper-parameters (seed 2004).
seed: 2004
embedding_dim: 32
classifier_stage: 1000
performance_scale: 0.98
max_epochs: 500
train_attribute: reconstructed   # reconstructed | ground_truth
valid_attribute: unobserved      # unobserved | reconstructed | ground_truth

ml-1m:
  init_lambdas: 10
  lr_prop: 0.001
  l2_w: 1.0e-6
  known_ratios: [0.1, 0.3, 0.5, 0.7, 0.9]
  refusal_known_ratios: [0.3, 0.5]
  refusal_ratios: [0.25, 0.5, 0.75, 1.0]

tenrec:
  init_lambdas: 1
  lr_prop: 0.01
  l2_w: 0.001
  known_ratios: [0.1, 0.3, 0.5, 0.7, 0.9]
  refusal_known_ratios: [0.3, 0.5]
  refusal_ratios: [0.25, 0.5, 0.75, 1.0]

refusal_ml-1m:
  init_lambdas: 5
  lr_prop: 0.001
  l2_w: 1.0e-5

refusal_tenrec:
  init_lambdas: 0.5
  lr_prop: 0.001
  l2_w: 1.0e-4
